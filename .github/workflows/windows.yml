
name: Windows Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-pkgconf

      - name: Compile Password Manager
        shell: msys2 {0}
        run: |
          gcc -Wall -Wextra -std=c11 -Iinclude \
          $(pkg-config --cflags libsodium) \
          src/main.c src/menu.c src/password.c \
          src/linked_list.c src/hash_table.c \
          src/storage.c src/encryption.c \
          -o password-manager.exe \
          $(pkg-config --libs --static libsodium) -static -static-libgcc

      - name: Compile encryption tests
        shell: msys2 {0}
        run: |
          gcc -Wall -Wextra -std=c11 -Iinclude \
          $(pkg-config --cflags libsodium) \
          tests/test_encryption.c src/encryption.c \
          -o tests/test_encryption.exe \
          $(pkg-config --libs --static libsodium) -static -static-libgcc

      - name: Run encryption tests
        shell: msys2 {0}
        run: ./tests/test_encryption.exe

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: password-manager-windows
          path: password-manager.exe
